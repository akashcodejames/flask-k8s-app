name: Self-Hosted Local Deployment

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'k8s/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted  # Runs on YOUR Mac M2
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker Images Locally
      run: |
        echo "🔨 Building backend image..."
        docker build -t flask-backend:latest ./backend
        
        echo "🔨 Building frontend image..."
        docker build -t flask-frontend:latest ./frontend

    - name: Load Images to Kind
      run: |
        echo "📦 Loading images to Kind cluster..."
        kind load docker-image flask-backend:latest --name akash-multi
        kind load docker-image flask-frontend:latest --name akash-multi

    - name: Deploy to Kubernetes
      run: |
        echo "☸️ Deploying to Kubernetes..."
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/backend-deployment.yaml
        kubectl apply -f k8s/backend-service.yaml
        kubectl apply -f k8s/frontend-deployment.yaml
        kubectl apply -f k8s/frontend-service.yaml
        kubectl apply -f k8s/ingress.yaml

    - name: Restart Deployments
      run: |
        echo "🔄 Restarting deployments to pick up new images..."
        kubectl rollout restart deployment/backend-deployment -n flask-app
        kubectl rollout restart deployment/frontend-deployment -n flask-app

    - name: Wait for Rollout
      run: |
        echo "⏳ Waiting for deployments to complete..."
        kubectl rollout status deployment/backend-deployment -n flask-app --timeout=90s
        kubectl rollout status deployment/frontend-deployment -n flask-app --timeout=90s

    - name: Verify Deployment
      run: |
        echo ""
        echo "✅ Deployment Complete!"
        echo ""
        echo "📊 Current Status:"
        kubectl get pods -n flask-app
        echo ""
        echo "🌐 Application URLs:"
        echo "   Frontend: http://akash.local"
        echo "   API:      http://akash.local/api/message"
        echo ""
        echo "🎉 Your local cluster has been updated!"
