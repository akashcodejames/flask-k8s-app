name: Self-Hosted Local Deployment

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'k8s/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted  # Runs on YOUR Mac M2
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set Image Tag
      id: vars
      run: |
        # Use git commit SHA for unique versioning
        IMAGE_TAG=$(git rev-parse --short HEAD)
        echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
        echo "📝 Image tag: ${IMAGE_TAG}"

    - name: Build Docker Images with Version Tag
      run: |
        echo "🔨 Building backend image with tag: ${{ steps.vars.outputs.IMAGE_TAG }}..."
        docker build -t flask-backend:${{ steps.vars.outputs.IMAGE_TAG }} -t flask-backend:latest ./backend
        
        echo "🔨 Building frontend image with tag: ${{ steps.vars.outputs.IMAGE_TAG }}..."
        docker build -t flask-frontend:${{ steps.vars.outputs.IMAGE_TAG }} -t flask-frontend:latest ./frontend

    - name: Load Images to Kind
      run: |
        echo "📦 Loading versioned images to Kind cluster..."
        kind load docker-image flask-backend:${{ steps.vars.outputs.IMAGE_TAG }} --name akash-multi
        kind load docker-image flask-frontend:${{ steps.vars.outputs.IMAGE_TAG }} --name akash-multi

    - name: Update Deployment Manifests
      run: |
        echo "📝 Updating deployment manifests with new image tag..."
        # Update backend deployment
        sed -i.bak "s|image: flask-backend:.*|image: flask-backend:${{ steps.vars.outputs.IMAGE_TAG }}|g" k8s/backend-deployment.yaml
        # Update frontend deployment
        sed -i.bak "s|image: flask-frontend:.*|image: flask-frontend:${{ steps.vars.outputs.IMAGE_TAG }}|g" k8s/frontend-deployment.yaml

    - name: Deploy to Kubernetes
      run: |
        echo "☸️ Deploying to Kubernetes..."
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/backend-deployment.yaml
        kubectl apply -f k8s/backend-service.yaml
        kubectl apply -f k8s/frontend-deployment.yaml
        kubectl apply -f k8s/frontend-service.yaml
        kubectl apply -f k8s/ingress.yaml

    - name: Wait for Rollout
      run: |
        echo "⏳ Waiting for deployments to complete..."
        kubectl rollout status deployment/backend-deployment -n flask-app --timeout=90s
        kubectl rollout status deployment/frontend-deployment -n flask-app --timeout=90s

    - name: Verify Deployment
      run: |
        echo ""
        echo "✅ Deployment Complete!"
        echo ""
        echo "📊 Current Status:"
        kubectl get pods -n flask-app
        echo ""
        echo "🏷️  Image Version: ${{ steps.vars.outputs.IMAGE_TAG }}"
        echo ""
        echo "🌐 Application URLs:"
        echo "   Frontend: http://akash.local"
        echo "   API:      http://akash.local/api/message"
        echo ""
        echo "🎉 Your local cluster has been updated!"
