apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: flask-app
  labels:
    app: flask-backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: flask-backend
        version: v1
    spec:
      containers:
      - name: flask-backend
        # This image will be updated by GitLab CI/CD pipeline
        image: asia-south1-docker.pkg.dev/flask-k8s-production/flask-repo/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        env:
        - name: FLASK_ENV
          value: "production"
        - name: PORT
          value: "5000"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
