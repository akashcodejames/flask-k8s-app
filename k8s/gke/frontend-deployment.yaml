apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: flask-app
  labels:
    app: flask-frontend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: flask-frontend
        version: v1
    spec:
      containers:
      - name: flask-frontend
        # This image will be updated by GitLab CI/CD pipeline
        image: asia-south1-docker.pkg.dev/flask-k8s-production/flask-repo/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
