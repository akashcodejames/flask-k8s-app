apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: flask-app
  labels:
    app: flask-backend
  annotations:
    cloud.google.com/backend-config: '{"default":"backend-config"}'
spec:
  type: ClusterIP
  selector:
    app: flask-backend
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
