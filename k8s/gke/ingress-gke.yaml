apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flask-app-ingress
  namespace: flask-app
  annotations:
    # GKE Ingress Controller
    kubernetes.io/ingress.class: "gce"
    # Enable HTTP to HTTPS redirect (optional)
    # kubernetes.io/ingress.allow-http: "false"
    # Use Google-managed SSL certificate (if configured)
    # networking.gke.io/managed-certificates: "flask-app-cert"
    # Backend configuration
    cloud.google.com/backend-config: '{"default": "backend-config"}'
spec:
  rules:
  - host: flask-app.example.com  # Change to your domain
    http:
      paths:
      # Frontend routes
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      # API routes
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80
  # Uncomment for HTTPS with managed certificate
  # tls:
  # - hosts:
  #   - flask-app.example.com
  #   secretName: flask-app-tls
